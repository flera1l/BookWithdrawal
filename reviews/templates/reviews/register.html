{% extends 'base.html' %}

{% block title %}Регистрация — BookPulse{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-dark p-4">
      <h3 class="fw-bold text-white mb-3 text-center">Регистрация</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-grid mt-3">
          <button type="submit" class="btn btn-purple">Создать аккаунт</button>
        </div>
      </form>
      <p class="text-center text-secondary mt-3 mb-0 small">
        Уже есть аккаунт? <a href="{% url 'login' %}" class="text-info">Войти</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
