{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card card-dark p-4">
      <h3 class="fw-bold text-white mb-3">{{ title }}</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'review_list' %}" class="btn btn-outline-secondary">Отмена</a>
          <button type="submit" class="btn btn-purple">Опубликовать</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
